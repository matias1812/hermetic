rules:
  - id: python-sql-injection-fastapi
    patterns:
      - pattern: cursor.execute($QUERY, ...)
      - pattern-inside: |
          def $FUNC(...):
            ...
      - metavariable-regex:
          metavariable: $QUERY
          regex: |
            .*(f".*"|f'.*'|%s|\.format\().*
    message: "Potential SQL injection detected via string formatting. Use parameterized queries (e.g. `execute('... ? ...', (var,))`)."
    severity: ERROR
    languages:
      - python

  - id: fastapi-missing-privacy-middleware
    patterns:
      - pattern: app = FastAPI(...)
      - pattern-not-inside: |
          app = FastAPI(...)
          ...
          app.add_middleware(TotalPrivacyMiddleware)
    message: "FastAPI app instance missing TotalPrivacyMiddleware. IP leakage possible."
    severity: WARNING
    languages:
      - python

  - id: sensitive-data-in-memory
    patterns:
      - pattern: $VAR = $SECRET
      - metavariable-regex:
          metavariable: $VAR
          regex: ".*(private_key|secret|password|mlkem|sphincs).*"
      - pattern-not-inside: |
          $VAR = $SECRET
          ...
          del $VAR
      # safe_zeroize() (hermes_backend/crypto_core/zeroize.py) es la limpieza real que
      # usa este codebase -- sobrescribe la memoria del bytearray/memoryview en vez de
      # solo soltar la referencia como hace `del`. Sin esta linea, cada sitio que ya
      # limpia correctamente via safe_zeroize() en un `finally` (ver hybrid_encryptor.py,
      # native_core.py) disparaba un falso positivo.
      - pattern-not-inside: |
          $VAR = $SECRET
          ...
          safe_zeroize($VAR)
    message: "Sensitive variable not explicitly deleted from memory. Consider zeroizing or using `del`."
    severity: INFO
    languages:
      - python
