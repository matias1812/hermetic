[package]
name = "hermes_crypto_wasm"
version = "0.1.0"
edition = "2021"
description = "Verifiable Constant-Time Cryptography & Memory Zeroization for HermesChat"
authors = ["HermesChat Security Team"]
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
zeroize = { version = "1.7", features = ["derive"] }
constant_time_eq = "0.3"
chacha20poly1305 = "0.10"
rand = { version = "0.8", features = ["getrandom"] }
getrandom = { version = "0.2", features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
sha3 = "0.10"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
hkdf = "0.12"
sha2 = "0.10"
argon2 = "0.5"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
thiserror = "1.0"
serde_json = "1.0"
ml-kem = { version = "0.3.2", features = ["getrandom"] }
ml-dsa = { version = "0.1.1" }
hex = "0.4.3"
aes-gcm = "0.11.0"
[dev-dependencies]
wasm-bindgen-test = "0.3"
rand_core = { version = "0.6", features = ["getrandom"] }

# =============================================================================
# Profile de release: optimizaciones de seguridad
# =============================================================================

[profile.release]
# Deshabilitar assertions en release (mejora performance, no afecta seguridad)
debug-assertions = false
# Optimización máxima
opt-level = 3
# LTO para mejor inlining y eliminación de código muerto
lto = true
# Pánico = abort en release (reduce tamaño, sin stack unwinding en WASM)
panic = "abort"

# =============================================================================
# Fuzz targets (requiere cargo-fuzz + nightly Rust en Linux/WSL)
# Para usar: cargo +nightly fuzz run fuzz_crypto
# =============================================================================

# [workspace] -- descomentar si se separa fuzz/ como workspace separado
