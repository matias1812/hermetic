\* MC_Memory.cfg — Configuración TLC para HermesMemory.tla
\*
\* Para ejecutar:
\*   tlc -config formal_spec/tlaplus/MC_Memory.cfg formal_spec/tlaplus/HermesMemory.tla
\*
\* Tamaños pequeños para model checking finito:
\* - MaxBuffers = 3 → explora todas las combinaciones de 3 buffers
\* - ByteValues = {0, 1} → simplificado (0=zeroized, 1=data)
\* - MaxBufSize = 2 → buffers de hasta 2 bytes

SPECIFICATION Spec

CONSTANTS
    MaxBuffers = 3
    ByteValues = {0, 1}
    MaxBufSize = 2

INVARIANT
    TypeInvariant
    MemoryCleanupInvariant
    ZeroizeBeforeFreeInvariant
    NoReuseAfterFreeInvariant

CHECK_DEADLOCK = TRUE
