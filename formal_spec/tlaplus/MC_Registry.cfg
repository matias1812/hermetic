\* MC_Registry.cfg — Configuración TLC para HermesRegistry.tla
\*
\* Para ejecutar:
\*   tlc -config formal_spec/tlaplus/MC_Registry.cfg formal_spec/tlaplus/HermesRegistry.tla
\*
\* Parámetros de model checking finito:
\* - MaxKeys = 4 → hasta 4 claves en el sistema
\* - KeySize = 4 → claves de 4 bytes (simplificado)

SPECIFICATION Spec

CONSTANTS
    MaxKeys = 4
    KeySize = 4

INVARIANT
    TypeInvariant
    NoKeyReuseInvariant
    NoDuplicateKeysInvariant
    KeyConsistencyInvariant
    RetiredKeysImmutableInvariant
    RetiredKeyNotUsableInvariant

CHECK_DEADLOCK = TRUE
