name: Python Backend CI & Security

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  test_and_ast:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install fastapi uvicorn cryptography websockets pydantic requests
        pip install pytest pytest-cov hypothesis bandit semgrep
        
    - name: Semgrep AST Security Scan
      run: semgrep ci --config=semgrep.yml
      
    - name: Run Bandit SAST
      run: bandit -r hermes_backend -ll -q
      
    - name: Run Unit & Property Tests with Coverage
      env:
        PYTHONPATH: .
      run: |
        pytest tests/test_hybrid_encryptor.py tests/phase7_audit.py --cov=hermes_backend --cov-report=xml
        
    - name: Upload Coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        fail_ci_if_error: false
