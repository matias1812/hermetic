name: Rust FFI (hermes_ffi_core / hermes_replay_sql / hermes_ffi_py)

# Gap encontrado en la auditoría del 2026-08-27: los crates de rust/ no tenían NINGÚN job de
# CI (solo hermes_crypto_wasm, en rust.yml/security_ci.yml, lo tiene). Eso dejó pasar
# desapercibido que los tests de hermes_ffi_core/src/replay/mod.rs no compilaban (la firma
# del trait ReplayStore se extendió con domain/ttl_seconds y los tests nunca se actualizaron)
# — cero tests ejecutables para el store anti-replay en memoria, el backend por defecto
# (HERMES_REPLAY_BACKEND=memory) en cualquier entorno que no sea producción explícita.
# hermes_replay_sql (el backend SQL que exige producción) tampoco tenía NINGÚN test propio —
# se le agregaron tests de integración reales (rust/hermes_replay_sql/src/lib.rs, módulo
# `tests`) que corren acá contra un MySQL real (servicio de este workflow), no mockeado. Ver
# BACKLOG.md, sección "Baja prioridad".

on:
  push:
    branches: [ "main", "develop" ]
    paths:
      - "rust/**"
      - ".github/workflows/rust_ffi.yml"
  pull_request:
    branches: [ "main", "develop" ]
    paths:
      - "rust/**"
      - ".github/workflows/rust_ffi.yml"

env:
  CARGO_TERM_COLOR: always

jobs:
  test_ffi_core:
    name: Test hermes_ffi_core (anti-replay store)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check Formatting & Lints
        run: |
          cd rust/hermes_ffi_core
          cargo fmt -- --check
          cargo clippy -- -D warnings

      - name: Run Tests
        run: |
          cd rust/hermes_ffi_core
          cargo test

  build_ffi_py:
    name: Build hermes_ffi_py (pyo3 extension, exercises the whole workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install native build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-dev pkg-config libssl-dev

      - name: Build (compiles hermes_ffi_core + hermes_replay_sql transitively)
        run: |
          cd rust/hermes_ffi_py
          cargo build

  test_replay_sql:
    name: Test hermes_replay_sql (MySQL integration)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: testpass
          MYSQL_DATABASE: hermes_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -uroot -ptestpass"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install MySQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mysql-client

      - name: Apply schema
        run: mysql -h127.0.0.1 -uroot -ptestpass hermes_test < rust/hermes_replay_sql/schema.sql

      - name: Check Formatting & Lints
        run: |
          cd rust/hermes_replay_sql
          cargo fmt -- --check
          cargo clippy --tests -- -D warnings

      - name: Run Tests (real MySQL, not mocked)
        env:
          TEST_DATABASE_URL: mysql://root:testpass@127.0.0.1:3306/hermes_test
        run: |
          cd rust/hermes_replay_sql
          cargo test -- --test-threads=1
