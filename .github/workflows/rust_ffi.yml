name: Rust FFI (hermes_ffi_core / hermes_replay_sql / hermes_ffi_py)

# Gap encontrado en la auditoría del 2026-08-27: los crates de rust/ no tenían NINGÚN job de
# CI (solo hermes_crypto_wasm, en rust.yml/security_ci.yml, lo tiene). Eso dejó pasar
# desapercibido que los tests de hermes_ffi_core/src/replay/mod.rs no compilaban (la firma
# del trait ReplayStore se extendió con domain/ttl_seconds y los tests nunca se actualizaron)
# — cero tests ejecutables para el store anti-replay en memoria, el backend por defecto
# (HERMES_REPLAY_BACKEND=memory) en cualquier entorno que no sea producción explícita.
# hermes_replay_sql (el backend SQL que exige producción) tampoco tenía NINGÚN test propio —
# se le agregaron tests de integración reales (rust/hermes_replay_sql/src/lib.rs, módulo
# `tests`) que corren acá contra un Postgres real (servicio de este workflow), no mockeado.
# Ver BACKLOG.md, sección "Baja prioridad". Portado de MySQL a Postgres (2026-08-29) para
# poder usar el Postgres gestionado de Render (no ofrece MySQL) tanto para este backend
# como para hermes_backend/network_core/db_connection.py.

on:
  push:
    branches: [ "main", "develop" ]
    paths:
      - "rust/**"
      - ".github/workflows/rust_ffi.yml"
  pull_request:
    branches: [ "main", "develop" ]
    paths:
      - "rust/**"
      - ".github/workflows/rust_ffi.yml"

env:
  CARGO_TERM_COLOR: always

jobs:
  test_ffi_core:
    name: Test hermes_ffi_core (anti-replay store)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check Formatting & Lints
        run: |
          cd rust/hermes_ffi_core
          cargo fmt -- --check
          cargo clippy -- -D warnings

      - name: Run Tests
        run: |
          cd rust/hermes_ffi_core
          cargo test

  build_ffi_py:
    name: Build hermes_ffi_py (pyo3 extension, exercises the whole workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install native build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-dev pkg-config libssl-dev

      - name: Build (compiles hermes_ffi_core + hermes_replay_sql transitively)
        run: |
          cd rust/hermes_ffi_py
          cargo build

  test_replay_sql:
    name: Test hermes_replay_sql (Postgres integration)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: hermes_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Postgres client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Apply schema
        env:
          PGPASSWORD: testpass
        run: psql -h127.0.0.1 -Upostgres -d hermes_test -f rust/hermes_replay_sql/schema.sql

      - name: Check Formatting & Lints
        run: |
          cd rust/hermes_replay_sql
          cargo fmt -- --check
          cargo clippy --tests -- -D warnings

      - name: Run Tests (real Postgres, not mocked)
        env:
          TEST_DATABASE_URL: postgresql://postgres:testpass@127.0.0.1:5432/hermes_test
        run: |
          cd rust/hermes_replay_sql
          cargo test -- --test-threads=1
