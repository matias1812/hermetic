name: OWASP ZAP DAST

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '0 0 * * 0' # Weekly

jobs:
  zap_scan:
    runs-on: ubuntu-latest
    name: Scan the webapplication
    # zaproxy/action-baseline abre/actualiza un Issue de GitHub con los hallazgos cuando
    # el scan encuentra algo (aunque sea solo WARN, no FAIL) -- sin este permiso explicito
    # el GITHUB_TOKEN por defecto no alcanza y el job falla con "Resource not accessible
    # by integration" DESPUES de escanear correctamente (0 FAIL, hallazgos reales o no).
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Start FastAPI Backend
        env:
          PYTHONPATH: .
          # SEC-01/SEC-02 (api.py): el backend aborta el arranque (fail-closed) sin estos
          # dos. Sin ellos, "nohup uvicorn ... &" crasheaba en silencio -- el step seguia
          # en verde porque nada chequeaba el exit code del proceso en background, y ZAP
          # recien se enteraba mas tarde via "Connection refused". Nunca escaneo un backend
          # real hasta que se agregaron estas dos variables.
          SESSION_SECRET: "zap-ci-ephemeral-session-secret-not-for-prod-32chars"
          ALLOWED_ORIGINS: "http://localhost:8000"
        run: |
          pip install -r requirements.txt
          nohup uvicorn hermes_backend.network_core.api:app --host 0.0.0.0 --port 8000 > backend.log 2>&1 &

          # Esperar activamente a que FastAPI levante -- y fallar el step explicitamente
          # si nunca contesta, en vez de dejar que ZAP sea el unico que se entera.
          for i in {1..30}; do
              curl -s http://127.0.0.1:8000/docs > /dev/null && exit 0
              sleep 1
          done
          echo "::error::FastAPI backend never became reachable on :8000. Log:"
          cat backend.log
          exit 1

      - name: ZAP Baseline Scan
        # v0.12.0 subia el reporte con una version deprecada de upload-artifact que el
        # backend de GitHub Actions ya rechaza ("Create Artifact Container failed: the
        # artifact name zap_scan is not valid") -- el scan en si corria bien (0 FAIL, el
        # Issue de resultados se creaba), pero el job igual quedaba en rojo por esto.
        # v0.14.0 es exactamente el release que dice "stop using deprecated upload-artifact
        # version" en su changelog.
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: 'http://localhost:8000'
          cmd_options: '-a'
          
      # Since we also have a frontend, we might want to scan it as well if it's served.
      # ZAP can spider and attack the endpoints.
