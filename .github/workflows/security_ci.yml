name: HermesChat Security CI & Supply Chain

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 2 * * *' # Fuzzing nocturno

jobs:
  audit-and-test:
    name: Crypto Core Audit & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Check Formatting & Lints
        run: |
          cd hermes_crypto_wasm
          cargo fmt -- --check
          cargo clippy -- -D warnings

      - name: Install wasm-pack
        # El instalador (curl | sh) fallo una vez en este job puntual con
        # "wasm-pack: command not found" (exit 127) en el step siguiente -- el MISMO
        # comando, mismo commit, corrio bien en rust.yml (otra VM del runner), asi que
        # fue un flake transitorio de red bajando el tarball de GitHub Releases, no un
        # problema real de PATH. Reintento simple + verificacion explicita despues, para
        # no depender de la suerte de nuevo y para fallar con un mensaje claro si alguna
        # vez es un problema real (PATH, rustup ausente, etc.) en vez del "command not
        # found" críptico del step de test.
        run: |
          for i in 1 2 3; do
            curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh && break
            echo "Intento $i de instalar wasm-pack fallo, reintentando..."
            sleep 5
          done
          wasm-pack --version

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Hybrid PQC Tests (WASM)
        run: |
          cd hermes_crypto_wasm
          wasm-pack test --node

  fuzzing:
    name: Continuous Fuzzing (Nightly)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nightly Rust
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz

      - name: Fuzz PQC Handshake (Fail-Closed validation)
        run: |
          cd hermes_crypto_wasm
          cargo +nightly fuzz run fuzz_handshake -- -max_total_time=300

  supply-chain:
    name: SLSA & SBOM Generation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-binstall & cargo-cyclonedx
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall -y cargo-cyclonedx

      - name: Generate SBOM
        run: |
          cd hermes_crypto_wasm
          cargo cyclonedx -f json -a
        
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: hermes-crypto-sbom
          path: hermes_crypto_wasm/bom.json
